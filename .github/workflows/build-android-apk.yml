name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/firebase-android-apk
      - feature/health-connect-samsung
      - feature/evoluafit-watch-companion
    paths:
      - "*.html"
      - "*.css"
      - "*.js"
      - "*.json"
      - "scripts/**"
      - "wear-companion/**"
      - "phone-wear-bridge/**"
      - "android-signing/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/build-android-apk.yml"
  pull_request:
    branches:
      - main
    paths:
      - "*.html"
      - "*.css"
      - "*.js"
      - "*.json"
      - "scripts/**"
      - "android-signing/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/build-android-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare web assets
        run: npm run prepare:web

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Inject Galaxy Watch Data Layer bridge
        run: |
          cp phone-wear-bridge/EvoluaFitWearListenerService.java android/app/src/main/java/com/evoluafit/app/EvoluaFitWearListenerService.java
          python - <<'PY'
          from pathlib import Path

          gradle = Path('android/app/build.gradle')
          g = gradle.read_text()
          dep = "implementation 'com.google.android.gms:play-services-wearable:20.0.1'"
          if dep not in g:
              g = g.replace('dependencies {', 'dependencies {\n    ' + dep, 1)
          gradle.write_text(g)

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          m = manifest.read_text()
          marker = 'EvoluaFitWearListenerService'
          if marker not in m:
              service = '''        <service
            android:name=".EvoluaFitWearListenerService"
            android:exported="true">
            <intent-filter>
                <action android:name="com.google.android.gms.wearable.DATA_CHANGED" />
                <data
                    android:scheme="wear"
                    android:host="*"
                    android:path="/evoluafit/health" />
            </intent-filter>
        </service>
'''
              m = m.replace('</application>', service + '    </application>', 1)
          manifest.write_text(m)
          print('Injected Wear OS Data Layer receiver into handheld app')
          PY

      - name: Configure Android min SDK for Health Connect
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('android/variables.gradle')
          s = p.read_text()
          s = re.sub(r'minSdkVersion\s*=\s*\d+', 'minSdkVersion = 26', s, count=1)
          p.write_text(s)
          print('Configured minSdkVersion=26 for Health Connect')
          PY

      - name: Configure stable development signing
        env:
          EVOLUAFIT_DEV_STORE_PASSWORD: EvoluaFitDev2026!
          EVOLUAFIT_DEV_KEY_PASSWORD: EvoluaFitDev2026!
        run: |
          base64 --decode android-signing/evoluafit-dev.jks.b64 > android/evoluafit-dev.jks
          python - <<'PY'
          from pathlib import Path
          import os, re

          p = Path('android/app/build.gradle')
          s = p.read_text()
          run_number = int(os.environ.get('GITHUB_RUN_NUMBER', '1'))

          s = re.sub(r'versionCode\s+\d+', f'versionCode {run_number}', s, count=1)
          s = re.sub(r'versionName\s+"[^"]+"', f'versionName "1.0.{run_number}"', s, count=1)

          if 'evoluaFitDev {' not in s:
              signing = '''    signingConfigs {\n        evoluaFitDev {\n            storeFile file("../evoluafit-dev.jks")\n            storePassword System.getenv("EVOLUAFIT_DEV_STORE_PASSWORD")\n            keyAlias "evoluafit-dev"\n            keyPassword System.getenv("EVOLUAFIT_DEV_KEY_PASSWORD")\n        }\n    }\n'''
              s = s.replace('android {\n', 'android {\n' + signing, 1)

          if 'signingConfig signingConfigs.evoluaFitDev' not in s:
              s = s.replace(
                  'buildTypes {',
                  'buildTypes {\n        debug {\n            signingConfig signingConfigs.evoluaFitDev\n        }',
                  1
              )

          p.write_text(s)
          print(f'Configured versionCode={run_number}, versionName=1.0.{run_number}')
          PY

      - name: Keep only required Health Connect read permissions
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()

          if 'xmlns:tools=' not in s:
              s = s.replace(
                  'xmlns:android="http://schemas.android.com/apk/res/android"',
                  'xmlns:android="http://schemas.android.com/apk/res/android"\n    xmlns:tools="http://schemas.android.com/tools"',
                  1
              )

          required = [
              'android.permission.ACCESS_COARSE_LOCATION',
              'android.permission.ACCESS_FINE_LOCATION',
              'android.permission.health.READ_STEPS',
              'android.permission.health.READ_DISTANCE',
              'android.permission.health.READ_ACTIVE_CALORIES_BURNED',
              'android.permission.health.READ_HEART_RATE',
              'android.permission.health.READ_WEIGHT',
              'android.permission.health.READ_SLEEP',
              'android.permission.health.READ_OXYGEN_SATURATION',
              'android.permission.health.READ_RESTING_HEART_RATE',
              'android.permission.health.READ_EXERCISE',
          ]

          remove = [
              'android.permission.health.READ_BASAL_BODY_TEMPERATURE',
              'android.permission.health.READ_BASAL_METABOLIC_RATE',
              'android.permission.health.READ_BLOOD_GLUCOSE',
              'android.permission.health.READ_BLOOD_PRESSURE',
              'android.permission.health.READ_BODY_FAT',
              'android.permission.health.READ_BODY_TEMPERATURE',
              'android.permission.health.READ_FLOORS_CLIMBED',
              'android.permission.health.READ_HEART_RATE_VARIABILITY',
              'android.permission.health.READ_HEIGHT',
              'android.permission.health.READ_HYDRATION',
              'android.permission.health.READ_MINDFULNESS',
              'android.permission.health.READ_NUTRITION',
              'android.permission.health.READ_RESPIRATORY_RATE',
              'android.permission.health.READ_TOTAL_CALORIES_BURNED',
              'android.permission.health.READ_VO2_MAX',
              'android.permission.health.WRITE_ACTIVE_CALORIES_BURNED',
              'android.permission.health.WRITE_BASAL_BODY_TEMPERATURE',
              'android.permission.health.WRITE_BASAL_METABOLIC_RATE',
              'android.permission.health.WRITE_BLOOD_GLUCOSE',
              'android.permission.health.WRITE_BLOOD_PRESSURE',
              'android.permission.health.WRITE_BODY_FAT',
              'android.permission.health.WRITE_BODY_TEMPERATURE',
              'android.permission.health.WRITE_DISTANCE',
              'android.permission.health.WRITE_FLOORS_CLIMBED',
              'android.permission.health.WRITE_HEART_RATE',
              'android.permission.health.WRITE_HEART_RATE_VARIABILITY',
              'android.permission.health.WRITE_HEIGHT',
              'android.permission.health.WRITE_HYDRATION',
              'android.permission.health.WRITE_MINDFULNESS',
              'android.permission.health.WRITE_NUTRITION',
              'android.permission.health.WRITE_OXYGEN_SATURATION',
              'android.permission.health.WRITE_RESPIRATORY_RATE',
              'android.permission.health.WRITE_RESTING_HEART_RATE',
              'android.permission.health.WRITE_SLEEP',
              'android.permission.health.WRITE_STEPS',
              'android.permission.health.WRITE_TOTAL_CALORIES_BURNED',
              'android.permission.health.WRITE_VO2_MAX',
              'android.permission.health.WRITE_WEIGHT',
          ]

          declarations = ''.join(
              f'    <uses-permission android:name="{name}" />\n'
              for name in required
              if f'android:name="{name}"' not in s
          )
          removals = ''.join(
              f'    <uses-permission android:name="{name}" tools:node="remove" />\n'
              for name in remove
          )

          marker = '<!-- EvoluaFit Health Connect permission filter -->'
          if marker not in s:
              payload = declarations + '    ' + marker + '\n' + removals + '\n'
              s = s.replace('<application', payload + '    <application', 1)

          p.write_text(s)
          print('Configured read-only Health Connect manifest permissions')
          PY

      - name: Build debug APK
        working-directory: android
        env:
          EVOLUAFIT_DEV_STORE_PASSWORD: EvoluaFitDev2026!
          EVOLUAFIT_DEV_KEY_PASSWORD: EvoluaFitDev2026!
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EvoluaFit-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14


  build-watch:
    if: github.ref == 'refs/heads/feature/evoluafit-watch-companion' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Prepare Watch signing
        env:
          EVOLUAFIT_DEV_STORE_PASSWORD: EvoluaFitDev2026!
          EVOLUAFIT_DEV_KEY_PASSWORD: EvoluaFitDev2026!
        run: |
          base64 --decode android-signing/evoluafit-dev.jks.b64 > wear-companion/evoluafit-dev.jks

      - name: Build EvoluaFit Watch APK
        env:
          EVOLUAFIT_DEV_STORE_PASSWORD: EvoluaFitDev2026!
          EVOLUAFIT_DEV_KEY_PASSWORD: EvoluaFitDev2026!
        run: |
          gradle -p wear-companion :app:assembleDebug --no-daemon

      - name: Verify Watch APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose --print-certs wear-companion/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload EvoluaFit Watch APK
        uses: actions/upload-artifact@v4
        with:
          name: EvoluaFit-Watch-debug-apk
          path: wear-companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
